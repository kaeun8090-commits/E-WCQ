<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>환경위기 대처 경향 자기점검</title>
<style>
:root{--bg:#f6f8f4;--fg:#1d2a22;--mut:#5d6b62;--card:#fff;--line:#d7e0d5;--acc:#2f7a4f;--accfg:#fff;--soft:#e4f0e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a15;--fg:#e8efe9;--mut:#9fb0a5;--card:#1b261f;--line:#2f3f35;--acc:#5fbf86;--accfg:#0f1a13;--soft:#223229}}
:root[data-theme="dark"]{--bg:#121a15;--fg:#e8efe9;--mut:#9fb0a5;--card:#1b261f;--line:#2f3f35;--acc:#5fbf86;--accfg:#0f1a13;--soft:#223229}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
main{max-width:640px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:21px;line-height:1.4;margin:6px 0 10px}h2{font-size:18px;margin:6px 0 8px}h3{font-size:16.5px;margin:0 0 2px}h4{font-size:15px;margin:14px 0 2px}
p{margin:6px 0}.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin:12px 0}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin:12px 0}
.opt{display:block;margin:7px 0;cursor:pointer}.opt input,.pill input{position:absolute;opacity:0}
.opt span{display:block;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px}
.opt:has(input:checked) span,.pill:has(input:checked) span{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.sc{display:flex;gap:7px;margin-top:8px}.pill{flex:1;cursor:pointer}.pill span{display:block;text-align:center;padding:10px 0;border:1px solid var(--line);border-radius:10px;font-weight:600}
.skip span{font-size:13.5px;color:var(--mut)}
.nav{display:flex;gap:10px;margin-top:18px}
button{font:inherit;border:0;border-radius:12px;padding:13px 18px;cursor:pointer;flex:1;background:var(--acc);color:var(--accfg);font-weight:700}
button.g{background:transparent;color:var(--fg);border:1px solid var(--line);flex:0 0 auto}button:disabled{opacity:.4;cursor:default}
input[type=text],textarea{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);margin-top:6px}
.bar{height:6px;background:var(--line);border-radius:4px;margin:0 0 14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
ul{padding-left:19px;margin:6px 0}li{margin:3px 0}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
.tag{color:var(--acc);font-weight:600;font-size:14.5px}
.res{background:var(--soft)}dt{font-weight:700;margin-top:8px;font-size:14.5px}dd{margin:0}
details{margin:8px 0}summary{cursor:pointer;font-weight:700}
.st{font-size:12px;color:var(--mut)}
</style></head><body><main id="app"></main>
<script>
const TY={A:['문제해결 중심 대처형','걱정을 지금 할 수 있는 일로! 작은 변화부터 시작하는 실천가'],B:['정서적 거리두기·회피형','마음이 버거울 땐 잠깐 거리두기! 쉬어 갈 공간을 찾는 마음 보호가'],C:['사회적 지지 추구형','혼자 끌어안기보다 함께 이야기하기! 연결 속에서 다음 걸음을 찾는 동행가'],D:['소망적 사고형','더 나아진 세상을 마음속에 그리기! 바라는 미래에서 위안을 찾는 상상가'],E:['긍정적 재평가형','걱정 속에서 나의 가치를 발견하기! 경험의 의미를 새롭게 읽는 해석가'],F:['복수 대처 경향형','한 가지 이름보다, 상황 속에서 달라지는 나의 반응을 살펴보기']};
const G={
A:{q:'걱정이 생기면, 내가 할 수 있는 일을 찾아요.',a:['환경문제로 걱정될 때, 해결에 도움이 되는 정보를 찾고 직접 행동해 보는 경향이 나타났어요. 막연히 고민하기보다 “지금 내가 바꿀 수 있는 건 무엇일까?”를 생각하는 편이에요.','일회용품 사용을 줄일 방법을 찾아보거나, 실천이 잘되지 않았을 때 준비물과 생활 동선을 바꾸는 모습이 여기에 해당해요.'],s:['큰 문제를 구체적인 행동으로 나눌 수 있어요. 직접 시도하면서 무엇이 가능한지, 어떤 도움이 필요한지도 알아갈 수 있죠. 잘되지 않은 경험도 다음 방법을 찾는 단서가 될 수 있어요.'],c:['환경문제 전체를 혼자 해결할 책임은 없어요. 개인의 실천과 함께 학교·기업·정부의 변화도 필요해요. 바로 성과가 보이지 않더라도 내 노력이 무의미한 것은 아니며, 지쳤을 때 쉬거나 도움을 구해도 괜찮아요.'],t:[['행동 하나를 정하고 ‘언제, 어디서, 어떻게’ 할지 구체화해 보세요.','“저녁에 가방을 챙길 때 물병을 함께 넣기.”'],['실천에 실패했다면 의지보다 조건을 먼저 살펴보세요.','“자주 잊으니까 물병을 가방 옆에 두기.”'],['혼자 바꾸기 어려운 문제는 학교에 제안하거나 다른 사람과 역할을 나눠 보세요.']],h:'짧고 구체적인 실천 안내, 역할을 나눌 수 있는 활동, 학생 제안에 답변해 주는 창구.',m:'오늘 가능한 한 걸음이면 충분해요.'},
B:{q:'마음이 버거울 때, 잠시 거리를 두어요.',a:['환경문제가 부담스럽게 느껴질 때, 관련 소식을 덜 보거나 다른 활동으로 주의를 돌리는 경향이 나타났어요. 걱정에서 잠시 벗어나 마음의 부담을 조절하려는 방식이에요.','이 결과만으로 환경에 관심이 없다고 볼 수는 없어요. 또한 잠깐 쉬는 것인지, 문제를 계속 피하고 있는 것인지는 점수만으로 구분하기 어려워요.'],s:['잠시 거리를 두는 행동은 쏟아지는 정보로부터 마음을 쉬게 하는 데 도움이 될 수 있어요. 부담을 알아차리고 정보의 양을 조절하는 것도 자신을 돌보는 방법이에요.'],c:['휴식은 괜찮지만, 피하는 것만으로 필요한 정보나 도움까지 놓치고 있지는 않은지 살펴보세요. 자극적인 콘텐츠는 줄이되, 폭염 행동요령처럼 생활에 필요한 안전 정보는 확인하는 것이 좋아요.'],t:[['관련 소식을 보는 시간과 양을 스스로 정해 보세요.','“계속 넘겨 보기보다 필요한 소식 하나만 확인하기.”'],['더 많은 뉴스를 찾아보지 않아도 할 수 있는 익숙한 행동부터 골라 보세요.','“급식은 먹을 수 있는 만큼 받고, 부족하면 더 받기.”'],['다시 참여할 준비가 되었을 때 선택할 수 있도록, 부담이 적은 활동 하나를 남겨 두세요.']],h:'공포를 자극하기보다 행동을 알려 주는 안내, 참여 여부를 선택할 수 있는 활동, 쉬었다가 다시 참여하기 편한 분위기.',m:'쉬어 가도 괜찮아요. 다시 시작하는 크기는 작아도 돼요.'},
C:{q:'혼자 끌어안기보다, 누군가와 나누어요.',a:['환경문제로 걱정되거나 대응 방법이 막막할 때, 다른 사람과 이야기하고 도움을 구하는 경향이 나타났어요. 마음을 이해받거나, 정보를 얻거나, 함께 행동할 사람을 찾는 방식이에요.','반드시 외향적이거나 많은 사람을 만나는 성격이라는 뜻은 아니에요. 믿을 수 있는 한 사람에게 마음을 털어놓는 것도 여기에 해당해요.'],s:['혼자서는 떠올리지 못했던 정보와 방법을 얻고, 부담을 나눌 수 있어요. 각자가 잘하는 일을 맡으면 혼자 하기 어려웠던 활동도 시도해 볼 수 있죠.'],c:['상대가 내 걱정을 가볍게 받아들였다고 해서 내 감정이 틀린 것은 아니에요. 반대로 걱정만 반복해서 나누다 보면 더 지칠 수도 있어요. 지금 필요한 것이 위로인지, 정보인지, 함께할 행동인지 구분해 보세요.'],t:[['원하는 도움을 구체적으로 말해 보세요.','“오늘은 해결책보다 내 이야기를 잠깐 들어 줬으면 좋겠어.”'],['함께 행동하고 싶다면 작고 분명한 제안을 해 보세요.','“분리배출 안내가 헷갈리는 곳을 같이 찾아볼래?”'],['함께할 사람이 없을 때도 할 수 있는 작은 대안을 마련해 두세요.']],h:'친구와 함께하는 소규모 활동, 걱정을 편하게 나눌 수 있는 자리, 역할과 시간이 명확한 공동 프로젝트.',m:'도움을 구하는 것도 문제에 대응하는 하나의 방법이에요.'},
D:{q:'더 나아진 미래를 떠올리며 마음을 달래요.',a:['환경문제로 마음이 무거울 때, 문제가 해결된 미래를 상상하거나 상황이 나아지기를 바라며 위안을 얻는 경향이 나타났어요.','새로운 기술이나 정책이 변화를 가져오기를 기대하는 모습도 여기에 해당해요. 이 결과가 무책임하거나 실천 의지가 없다는 뜻은 아니에요.'],s:['바라는 미래를 떠올리는 것은 무거운 마음을 잠시 달래는 데 도움이 될 수 있어요. 또한 “나는 어떤 세상에서 살고 싶은가?”를 생각하는 출발점이 될 수 있죠.'],c:['나아지기를 바라는 마음과 실제로 변화가 일어나는 조건은 구분할 필요가 있어요. 기술과 정책에도 한계와 실행 과정이 있으므로, 기대하는 변화가 어떻게 가능한지 함께 살펴보세요.'],t:[['바라는 미래를 한 문장으로 적어 보세요.','“길에 쓰레기가 덜 버려졌으면 좋겠다.”'],['그 미래에 필요한 조건을 생각해 보세요.','“버릴 곳과 분리배출 방법이 더 잘 보이면 좋겠다.”'],['내가 보탤 수 있는 작은 행동으로 연결해 보세요.','“학교에서 안내가 필요한 장소를 찾아 의견 내기.”']],h:'실제 해결 사례와 남은 과제를 함께 보여 주는 자료, 의견을 전달하고 답변받는 창구, 작은 변화를 확인할 수 있는 활동.',m:'바라는 미래에, 오늘 가능한 행동 하나를 더해 보세요.'},
E:{q:'걱정 속에서 내가 중요하게 여기는 것을 찾아요.',a:['환경문제로 걱정될 때, 그 경험을 통해 자신의 가치와 생활을 돌아보는 경향이 나타났어요. “왜 이 문제가 마음에 남을까?”, “나는 무엇을 지키고 싶을까?”를 생각하며 의미를 찾는 방식이에요.','환경 피해를 좋게 보거나, 무조건 긍정적으로 생각한다는 뜻은 아니에요.'],s:['내가 소중히 여기는 가치와 일상의 선택을 연결할 수 있어요. 다른 사람이 시켜서 하는 행동을 넘어, 나에게 어떤 의미가 있는 실천인지 생각해 볼 수 있죠.'],c:['모든 걱정에서 배울 점이나 좋은 의미를 찾아야 하는 것은 아니에요. 속상함과 화를 그대로 느껴도 괜찮아요. 의미를 발견했다면 실제로 무엇을 바꿀 수 있을지도 함께 생각해 보세요.'],t:[['마음에 남은 장면과 감정을 적어 보세요.','“쓸 수 있는 물건이 버려지는 모습을 보니 아까웠다.”'],['그 감정과 연결된 가치를 찾아보세요.','“나는 자원을 오래 사용하는 것을 중요하게 생각한다.”'],['그 가치에 맞는 행동 하나를 골라 보세요.','“새 물건을 사기 전에 이미 가진 것을 확인하기.”']],h:'생각과 감정을 표현하는 활동, 자신의 가치에 맞게 실천을 고르는 기회, 다양한 관점을 존중하는 대화.',m:'억지로 좋게 생각하지 않아도 돼요. 내가 지키고 싶은 것부터 찾아보세요.'},
F:{q:'이번 응답은 한 가지 이름으로 정리되지 않았어요.',a:['이번 응답에서는 정해진 점수 계산 기준으로 하나의 대처 경향을 구분하기 어려웠어요. 자기평가 점수가 같거나, 동점인 경향들을 상황 문항으로도 구분하기 어려울 때 이 안내가 나타나요.','F는 별도의 여섯 번째 성격 유형이 아니에요. 여러 방법을 유연하게 사용한다거나, 응답을 잘못했다는 뜻으로 단정할 수도 없어요.'],s:['하나의 이름을 정하는 것보다 각 설명이 실제 경험과 얼마나 맞는지 살펴보는 것이 중요해요. 여러 경향에 모두 높은 점수를 준 경우와 모두 낮은 점수를 준 경우도 다를 수 있으니, 점수와 설명을 함께 확인해 보세요.'],c:['특정 유형이 나올 때까지 다시 검사할 필요는 없어요. 점수가 비슷한 설명 가운데 최근 경험과 가까운 부분을 골라 읽어 보세요. 어느 설명도 잘 맞지 않는다면 그것 역시 가이드를 개선하는 데 필요한 의견이에요.'],tp:'최근 환경문제로 걱정했던 장면 하나를 떠올리고 질문해 보세요.',t:[['“그때 나는 가장 먼저 무엇을 했을까?”'],['“그 행동은 나에게 어떤 도움이 되었을까?”'],['“지금은 행동, 휴식, 대화, 정보 중 무엇이 필요할까?”']],tz:'답에 맞춰 다른 결과페이지의 실천 팁을 하나 골라 보세요. 상황이 달라지면 다른 방법을 선택해도 괜찮아요.',h:'여러 방식 중 원하는 활동을 선택할 수 있는 구성, 중간에 참여 방식을 바꿀 수 있는 기회, 결과를 단정하지 않고 함께 살펴보는 안내.',m:'한 가지 이름보다, 지금 나에게 필요한 방법이 더 중요해요.'}};
const Q=[
[1,'C','환경문제로 걱정되면, 내 마음을 이해받거나 위로받기 위해 다른 사람에게 이야기를 꺼내는 편이다.'],

function go(s){S.step=s;scrollTo(0,0);const h={
intro:()=>`<h1>환경위기를 마주하는 나, 어떤 방식으로 대처하고 있을까요?</h1><p>환경 뉴스를 보고 마음이 무거웠던 적이 있나요? 무엇인가 해보고 싶기도 하고, 잠시 생각을 멈추고 싶거나 누군가와 이야기하고 싶을 때도 있을 거예요.</p><p>이 설문은 환경문제로 걱정되거나 부담스러울 때 내가 어떻게 대처하는지, 그리고 학교에서 어떤 도움을 제공하면 좋을지 알아보기 위한 학생 탐구 프로젝트입니다. 환경문제는 기후변화와 폭염뿐 아니라 쓰레기, 플라스틱 오염, 생태계 훼손 등을 포함해요.</p><p>이 자기점검은 불안의 심각성이나 정신건강 상태, 성격을 진단하는 검사가 아니에요. 같은 사람도 상황에 따라 여러 대처 방법을 함께 사용할 수 있어요. 정답이나 더 좋은 유형은 없으니, 좋아 보이는 답보다 실제 나의 반응에 가까운 답을 골라주세요.</p><p class="mut">진행: 유스그린리더 5기 강가은</p><div class="card"><h3>참여 안내</h3><ul><li>자발적으로 참여하며, 원하지 않는 질문은 건너뛰거나 언제든 중단할 수 있어요.</li><li>이름, 학번, 전화번호, 이메일은 받지 않아요.</li><li>응답은 자동으로 부여되는 응답 번호로 연결하며, 탐구보고서 작성과 캠페인·가이드 개선에 사용해요.</li><li>보고서에는 여러 사람의 응답을 묶어 제시해요. 자유 의견은 개인을 알아볼 수 있는 내용을 제외하고 소개해요.</li><li>자유 의견에는 본인이나 다른 사람의 이름, 반, 연락처를 적지 말아주세요.</li><li>자기점검 문항을 건너뛰면 개인별 결과가 나오지 않을 수 있지만, 대처 방법 가이드는 읽을 수 있어요.</li></ul></div><p><b>위 안내를 읽고 설문 참여에 동의하나요?</b></p>${rd('c',1,'안내를 읽었으며, 자발적으로 참여하는 데 동의합니다.',S.consent==1)}${rd('c',2,'설문에 참여하지 않고 안내 자료만 보겠습니다.',S.consent==2)}${nav(0)}`,
info:()=>`${bar(5)}<h2>기본 정보</h2><div class="q"><p><b>1. 현재 학년을 선택해주세요.</b></p>${['고등학교 1학년','고등학교 2학년','고등학교 3학년','기타','응답하고 싶지 않음'].map((x,i)=>rd('g',i+1,x,S.grade==i+1)).join('')}</div><div class="q"><p><b>2. 지금까지 환경문제로 걱정되거나 마음이 부담스러웠던 적이 있나요?</b></p>${['있어요.','없어요.','잘 모르겠어요.','응답하고 싶지 않아요.'].map((x,i)=>rd('e',i+1,x,S.exp==i+1)).join('')}</div>${nav(1)}`,
q:i=>`${bar(10+i*20)}${i==0?'<div class="card"><p><b>자기점검을 시작하기 전에</b></p><p class="mut">문장은 두 가지 방식이에요. ① 평소 반응을 묻는 문장: 최근 한 달 동안 환경문제로 걱정되거나 부담스러웠던 경험을 떠올리고(없다면 그 이전 경험도 괜찮아요), 문장이 나와 얼마나 비슷한지 골라주세요. 1 전혀 그렇지 않다 · 2 그렇지 않은 편이다 · 3 보통이다 · 4 그런 편이다 · 5 매우 그렇다. 3점은 ‘모르겠다’가 아니라 비슷한 정도가 중간이라는 뜻이에요. ② 상황을 읽고 반응을 고르는 문장: 내가 가장 먼저 할 것 같은 반응 하나를 골라주세요. 판단하기 어려우면 ‘건너뛰기’를 선택할 수 있어요.</p></div>':''}${chunks[i].map(qh).join('')}${nav(1,i==3?(S.exp==1?'다음':'다음'):'다음')}`,
need:()=>`${bar(90)}<h2>학교에서 어떤 도움을 제공하면 좋을까요?</h2><p class="mut">다음 질문은 결과 유형의 점수에 들어가지 않아요. 학생들이 겪는 어려움과 필요한 지원을 알아보기 위한 질문이에요.</p><div class="q"><p><b>27. 환경 실천을 할 때 가장 어려운 점은 무엇인가요?</b> (가장 가까운 것 하나)</p>${N27.map((x,i)=>rd('n27',i+1,x,S.n27==i+1)).join('')}<input type="text" id="o27" placeholder="기타 내용을 적어주세요" value="${(S.o27||'').replace(/"/g,'')}" style="display:${S.n27==8?'block':'none'}" maxlength="80"></div><div class="q"><p><b>28. 학교에서 다음과 같은 도움을 제공한다면, 이용하고 싶은 것은 무엇인가요?</b> (최대 2개)</p><p class="mut">‘지금은 특별한 도움이 필요하지 않아요’는 다른 항목과 함께 선택하지 않아요.</p>${N28.map((x,i)=>`<label class="opt"><input type="checkbox" name="n28" value="${i+1}"${S.n28.includes(i+1)?' checked':''}><span>${x[0]}${x[1]?'<br><small class="mut">'+x[1]+'</small>':''}</span></label>`).join('')}<input type="text" id="o28" placeholder="기타 내용을 적어주세요" value="${(S.o28||'').replace(/"/g,'')}" style="display:${S.n28.includes(8)?'block':'none'}" maxlength="80"></div>${nav(S.exp==1,'결과 보기')}`,
guide:()=>`${common(S.consent==2?'참여하지 않고 안내 자료만 보기로 선택하셨어요. 다섯 가지 대처 방법을 소개해요.':'')}<p class="mut">읽어주셔서 고마워요.</p>`
};
if(s=='result')return result();if(s=='thanks')return thanks();
app.innerHTML=(h[s]?h[s]():h.q(+s[1]));upd();}
function result(){const r=S.r=calc();let h=`${bar(96)}<h2>나의 대처 경향</h2>`;
if(r.res=='NONE')h+=common('환경문제로 걱정된 경험이 아직 없거나 답하기 어렵다면 유형을 나누지 않아요. 대신 다섯 가지 대처 방법을 소개할게요.');
else if(r.res=='INCOMPLETE')h+=common('건너뛴 문항이 있어 개인별 결과는 보여드리지 않아요. 대신 다섯 가지 대처 방법을 소개할게요.');
else{const ord=Object.keys(r.avg).sort((a,b)=>r.avg[b]-r.avg[a]||r.ct[b]-r.ct[a]);
h+=`<p class="mut">이 결과는 현재 응답에서 나타난 환경위기 대처 경향입니다. 심리 진단이나 고정된 성격 유형이 아니며, 상황에 따라 달라질 수 있습니다. 유형 간 우열은 없습니다.</p><div class="card res"><p class="mut">이번 응답에서 두드러진 경향</p><h1>${r.res+' '}${TY[r.res][0]}</h1><p class="tag">“${G[r.res].q}”</p></div><p class="mut">점수가 높다는 것은 그 반응이 나와 비슷하다고 답했다는 뜻이며, 더 좋은 유형이라는 뜻은 아니에요. 점수가 비슷한 다른 경향의 설명도 함께 읽어보세요.</p><div class="card">${ord.map(k=>`<div class="row"><span>${k} ${TY[k][0]}</span><span>평소 ${r.avg[k].toFixed(2)}점 · 상황 ${r.ct[k]}회</span></div>`).join('')}</div>`;
if(r.res=='F')h+=guide('F',1)+'<p class="mut">점수가 높은 경향의 설명</p>'+ord.slice(0,3).map(k=>guide(k)).join('');
else h+=guide(r.res,1)+`<p class="mut">다른 경향 설명</p>`+ord.filter(k=>k!=r.res).map(k=>guide(k)).join('')}
h+=`<p class="mut">지금 나에게 맞는 실천과 도움을 골라 보세요. 소개된 학교 지원은 제안이며, 실제 운영 여부는 학교마다 다릅니다.</p><p>결과와 가이드가 얼마나 도움이 되었는지 솔직하게 알려 주세요.</p><div class="q"><p><b>29. 방금 읽은 설명과 실천 가이드는 나에게 얼마나 도움이 되었나요?</b></p>${['전혀 도움이 되지 않았어요.','별로 도움이 되지 않았어요.','보통이었어요.','도움이 되었어요.','매우 도움이 되었어요.','충분히 읽지 못해 판단하기 어려워요.'].map((x,i)=>rd('rt',i+1,x,S.rt==i+1)).join('')}</div><div class="q"><p><b>30. 도움이 된 점이나 바꾸었으면 하는 점이 있다면 자유롭게 적어주세요.</b> (선택)</p><p class="mut">본인이나 다른 사람의 이름·반·연락처는 적지 말아주세요.</p><textarea id="cm" rows="3" maxlength="400">${(S.cm||'')}</textarea></div><div class="nav"><button id="nx" disabled>다음: 응답 저장하기</button></div>`;
app.innerHTML=h;upd()}
function thanks(){const L=flink(),code=Object.values(flat()).join('|');app.innerHTML=`<h1>마지막으로, 응답을 저장해주세요</h1>${L?`<p>아래 버튼을 누르면 응답이 채워진 화면이 열려요. 내용은 바꾸지 말고 <b>제출</b>만 눌러주세요. ‘응답이 기록되었습니다’가 보이면 끝이에요.</p><a href="${L}" target="_blank" rel="noopener"><button style="width:100%">응답 저장하기 (제출 화면 열기)</button></a>`:`<div class="card"><p>구글폼 연결 전이라 저장 버튼이 아직 없어요. (테스트용 화면)</p></div>`}<h2>참여해주셔서 고마워요!</h2><p>여러분의 응답은 학생들에게 필요한 환경 실천 지원과 가이드를 만드는 데 활용할게요.</p><div class="card"><p>부스에서는 내가 해보고 싶은 작은 실천 한 가지를 포스트잇에 적어볼 수 있어요.</p><p>‘환경을 지키겠다’처럼 넓은 다짐보다, 언제 무엇을 할지 적어보세요.</p><p class="mut">예시: “내일 점심에는 먹을 만큼 먼저 받고, 부족하면 더 받기.”</p><p>반드시 결과 유형에 맞추지 않아도 괜찮아요. 지금 나에게 가능한 행동을 직접 골라주세요.</p></div><details><summary class="mut">응답 코드 (저장이 안 될 때만)</summary><textarea readonly rows="3">${code}</textarea></details>`}
function flat(){const v={ver:VER,id:S.id,consent:S.consent,grade:S.grade||'',exp:S.exp||'',res:(S.r||{}).res||'',n27:S.n27||'',o27:S.o27||'',n28:S.n28.join(','),o28:S.o28||'',rt:S.rt||'',cm:(S.cm||'').trim(),secs:Math.round((Date.now()-S.t0)/1000)};for(const q of Q)v['q'+q[0]]=S.ans[q[0]]===undefined?'':S.ans[q[0]];return v}
function flink(){if(!FORM.base)return'';const p=new URLSearchParams({usp:'pp_url'}),v=flat();for(const k in FORM.e)p.set('entry.'+FORM.e[k],v[k]);return FORM.base+'?'+p}
document.addEventListener('change',e=>{const t=e.target,n=t.name;if(!n)return;
if(n=='c')S.consent=+t.value;else if(n=='g')S.grade=+t.value;else if(n=='e')S.exp=+t.value;
else if(n[0]=='q')S.ans[+n.slice(1)]=+t.value;
else if(n=='n27'){S.n27=+t.value;E('o27').style.display=S.n27==8?'block':'none'}
else if(n=='rt')S.rt=+t.value;
else if(n=='n28'){let v=+t.value;if(t.checked){if(v==7)S.n28=[7];else{S.n28=S.n28.filter(x=>x!=7);if(S.n28.length>=2){t.checked=false}else S.n28.push(v)}}else S.n28=S.n28.filter(x=>x!=v);
document.querySelectorAll('input[name=n28]').forEach(i=>i.checked=S.n28.includes(+i.value));E('o28').style.display=S.n28.includes(8)?'block':'none'}
upd()});
document.addEventListener('input',e=>{const i=e.target.id;if(i=='o27')S.o27=e.target.value;else if(i=='o28')S.o28=e.target.value;else if(i=='cm')S.cm=e.target.value;upd()});
function upd(){const b=E('nx');if(b)b.disabled=S.step=='result'?false:!ok()}
const ORDER=['intro','info','q0','q1','q2','q3','need','result'];
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
if(b.id=='bk'){let i=ORDER.indexOf(S.step);let p=ORDER[i-1];if(S.step=='need')p=S.exp==1?'q3':'info';go(p)}
else if(b.id=='nx'){if(S.step=='intro'){go(S.consent==2?'guide':'info')}
else if(S.step=='info'){go(S.exp==1?'q0':'need')}
else if(S.step=='q3'){go('need')}
else if(S.step=='need'){go('result')}
else if(S.step=='result'){go('thanks')}
else{go(ORDER[ORDER.indexOf(S.step)+1])}}
if(S.step!='thanks')setTimeout(upd,0)});
go('intro');
</script></body></html>
