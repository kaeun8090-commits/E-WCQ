<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>환경위기 대처 경향 자기점검</title>
<style>
:root{--bg:#f6f8f4;--fg:#1d2a22;--mut:#5d6b62;--card:#fff;--line:#d7e0d5;--acc:#2f7a4f;--accfg:#fff;--soft:#e4f0e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a15;--fg:#e8efe9;--mut:#9fb0a5;--card:#1b261f;--line:#2f3f35;--acc:#5fbf86;--accfg:#0f1a13;--soft:#223229}}
:root[data-theme="dark"]{--bg:#121a15;--fg:#e8efe9;--mut:#9fb0a5;--card:#1b261f;--line:#2f3f35;--acc:#5fbf86;--accfg:#0f1a13;--soft:#223229}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
main{max-width:640px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:21px;line-height:1.4;margin:6px 0 10px}h2{font-size:18px;margin:6px 0 8px}h3{font-size:16.5px;margin:0 0 2px}
p{margin:6px 0}.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin:12px 0}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin:12px 0}
.opt{display:block;margin:7px 0;cursor:pointer}.opt input,.pill input{position:absolute;opacity:0}
.opt span{display:block;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px}
.opt:has(input:checked) span,.pill:has(input:checked) span{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.sc{display:flex;gap:7px;margin-top:8px}.pill{flex:1;cursor:pointer}.pill span{display:block;text-align:center;padding:10px 0;border:1px solid var(--line);border-radius:10px;font-weight:600}
.skip span{font-size:13.5px;color:var(--mut)}
.nav{display:flex;gap:10px;margin-top:18px}
button{font:inherit;border:0;border-radius:12px;padding:13px 18px;cursor:pointer;flex:1;background:var(--acc);color:var(--accfg);font-weight:700}
button.g{background:transparent;color:var(--fg);border:1px solid var(--line);flex:0 0 auto}button:disabled{opacity:.4;cursor:default}
input[type=text],textarea{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);margin-top:6px}
.bar{height:6px;background:var(--line);border-radius:4px;margin:0 0 14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
ul{padding-left:19px;margin:6px 0}li{margin:3px 0}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
.tag{color:var(--acc);font-weight:600;font-size:14.5px}
.res{background:var(--soft)}dt{font-weight:700;margin-top:8px;font-size:14.5px}dd{margin:0}
details{margin:8px 0}summary{cursor:pointer;font-weight:700}
.st{font-size:12px;color:var(--mut)}
</style></head><body><main id="app"></main>
<script>
const TY={A:['문제해결 중심 대처형','걱정을 지금 할 수 있는 일로! 작은 변화부터 시작하는 실천가'],B:['정서적 거리두기·회피형','마음이 버거울 땐 잠깐 거리두기! 쉬어 갈 공간을 찾는 마음 보호가'],C:['사회적 지지 추구형','혼자 끌어안기보다 함께 이야기하기! 연결 속에서 다음 걸음을 찾는 동행가'],D:['소망적 사고형','더 나아진 세상을 마음속에 그리기! 바라는 미래에서 위안을 찾는 상상가'],E:['긍정적 재평가형','걱정 속에서 나의 가치를 발견하기! 경험의 의미를 새롭게 읽는 해석가'],F:['복수 대처 경향형','한 가지 이름보다, 상황 속에서 달라지는 나의 반응을 살펴보기']};
const G={
A:{f:'걱정이 생기면 내가 바꿀 수 있는 행동을 찾아 실제로 해 보는 편이에요.',g:'실천이 빠르고, 막막한 마음을 구체적인 계획으로 바꿀 수 있어요.',w:'혼자 다 해내려 하면 쉽게 지칠 수 있어요. 결과가 바로 보이지 않아도 괜찮아요.',p:'이번 주에 할 일을 딱 하나만 정해요. 예) 텀블러 챙기기, 분리배출 한 번 더 확인하기.',m:'오늘 한 작은 행동도 충분히 의미 있어요.'},
B:{f:'마음이 버거울 땐 관련 소식을 잠시 멀리하며 나를 보호하는 편이에요.',g:'지치기 전에 쉬어 갈 줄 알아서 마음의 부담을 조절할 수 있어요.',w:'거리두기가 길어지면 관심 자체가 멀어질 수 있어요. 쉬는 것과 영영 피하는 것은 달라요.',p:'쉬는 시간과 돌아올 시점을 함께 정해요. 예) 오늘은 쉬고, 내일 5분만 분리배출 확인하기.',m:'쉬어 가도 괜찮아요. 준비되면 다시 돌아오면 돼요.'},
C:{f:'걱정이 생기면 가까운 사람과 이야기하며 마음을 나누고 방향을 찾는 편이에요.',g:'위로를 주고받으며 혼자 끌어안지 않고, 함께 실천을 이어 갈 수 있어요.',w:'이야기로만 끝나거나 주변의 반응에 따라 흔들릴 수 있어요. 필요한 도움을 구체적으로 말해 보세요.',p:'친구 한 명과 이번 주에 같이 할 일을 정하고 역할을 나눠요.',m:'혼자 감당하지 않아도 돼요.'},
D:{f:'걱정될 때 나아진 미래를 그려 보며 마음을 달래는 편이에요.',g:'희망을 놓지 않고, 걱정을 가볍게 만들 수 있어요.',w:'누군가 해결해 주리라는 기대만 커지면 내 행동이 멀어질 수 있어요.',p:'그리는 미래에 필요한 조건을 하나 적고, 내가 할 수 있는 작은 행동을 연결해요.',m:'바라는 마음도 소중한 출발점이에요.'},
E:{f:'걱정 속에서도 내가 소중히 여기는 가치와 배울 점을 찾아보는 편이에요.',g:'걱정을 의미로 바꾸어 나의 방향을 잡는 힘이 있어요.',w:'억지로 좋게만 보려 하면 힘든 마음을 놓칠 수 있어요. 속상한 마음도 함께 인정해 주세요.',p:'내가 소중히 여기는 가치를 한 문장으로 쓰고, 그에 맞는 소비 습관 하나를 골라 봐요.',m:'걱정은 내가 무엇을 아끼는지 알려 주는 신호예요.'},
F:{f:'한 가지 경향이 뚜렷하게 앞서지 않았어요. 상황에 따라 여러 방법을 함께 쓰는 모습이에요.',g:'상황에 맞게 방법을 바꿔 쓸 수 있는 유연함이 있어요.',w:'어떤 방법이 지금 나에게 도움이 되는지 가끔 돌아보면 좋아요.',p:'아래 점수가 높은 경향의 설명을 함께 읽고, 마음에 드는 실천을 하나 골라 봐요.',m:'한 가지 이름에 나를 맞추지 않아도 괜찮아요.'}};
const Q=[
[1,'C','환경문제로 걱정되면, 내 마음을 이해받거나 위로받기 위해 다른 사람에게 이야기를 꺼내는 편이다.'],
[2,'S','미세플라스틱으로 인한 환경오염을 다룬 뉴스를 보고 걱정되었어요. 이때 내가 가장 먼저 할 것 같은 반응은 무엇인가요?',['마음이 무거워져 뉴스를 잠시 닫고, 다른 활동으로 주의를 돌린다.','이 소식이 마음에 남는 이유를 생각하며, 내 생활에서 중요하게 여기는 가치를 돌아본다.','내 생활에서 플라스틱 사용을 줄일 수 있는 방법을 찾아본다.','오염 문제가 해결된 미래를 떠올리며, 상황이 나아지기를 바란다.','가까운 사람에게 걱정을 이야기하고, 위로나 조언을 구한다.'],'BEADC'],
[3,'B','환경문제가 부담스럽게 느껴지면, 관련 소식을 잠시 멀리하고 다른 일로 주의를 돌리는 편이다.'],
[4,'S','폭염이 사람과 동식물의 생활에 미치는 영향을 다룬 뉴스를 보고 걱정되었어요. 이때 내가 가장 먼저 할 것 같은 반응은 무엇인가요?',['앞으로 더 나은 해결책이 나와 상황이 좋아지기를 바라며 마음을 달랜다.','주변 사람에게 걱정을 이야기하고, 위로나 대응에 필요한 조언을 구한다.','관련 소식을 더 찾아보기보다 잠시 다른 일에 집중한다.','건강을 지키는 데 필요한 냉방은 유지하면서, 불필요한 에너지 사용을 줄일 방법을 찾는다.','당연하게 여겼던 일상의 소중함을 생각하며, 내가 지키고 싶은 가치를 돌아본다.'],'DCBAE'],
[5,'D','환경문제로 걱정될 때, 문제가 해결된 미래의 모습을 상상하며 마음을 달래는 편이다.'],
[6,'S','등굣길에 일회용 컵과 포장 쓰레기가 쌓인 모습을 보고 환경오염이 걱정되었어요. 이때 내가 가장 먼저 할 것 같은 반응은 무엇인가요?',['물건을 쓰고 버리는 모습을 보며, 내가 중요하게 여기는 생활의 가치를 돌아본다.','친구에게 걱정을 이야기하고, 어떻게 대응하면 좋을지 의견을 구한다.','쓰레기가 쌓이지 않는 깨끗한 거리를 상상하며, 그런 모습이 되기를 바란다.','쓰레기를 줄이거나 적절히 처리하는 데 내가 할 수 있는 일을 찾아본다.','마음이 불편해져 시선을 돌리고, 다른 생각을 하며 지나간다.'],'ECDAB'],
[7,'A','환경문제로 걱정되면, 내가 바꿀 수 있는 행동을 찾아 실제로 해 보는 편이다.'],
[8,'S','계속되는 폭염으로 일상이 불편해지면서, 환경위기가 앞으로의 생활에 미칠 영향이 걱정되었어요. 이때 내가 가장 먼저 할 것 같은 반응은 무엇인가요?',['이 걱정을 통해 자연과 일상에서 내가 소중하게 여기는 것이 무엇인지 생각해 본다.','평소의 환경 실천을 살펴보고, 내 생활에서 실행할 수 있는 일을 하나 정한다.','앞으로 상황이 나아져 편안하게 생활하는 모습을 상상하며 마음을 달랜다.','계속 생각하면 지칠 것 같아, 잠시 다른 활동에 몰두한다.','주변 사람에게 내 마음을 이야기하고, 위로나 도움을 구한다.'],'EADBC'],
[9,'E','환경문제로 걱정될 때, 그 경험을 통해 내가 중요하게 여기는 가치가 무엇인지 돌아보는 편이다.'],
[10,'C','환경문제에 어떻게 대응해야 할지 막막하면, 다른 사람에게 필요한 정보나 구체적인 도움을 구하는 편이다.'],
[11,'B','환경문제에 대한 불편한 생각이 떠오르면, 그 문제를 더 생각하지 않으려 하는 편이다.'],
[12,'D','환경문제로 마음이 무거울 때, 상황이 내가 바라는 방향으로 달라지기를 바라며 스스로를 달래는 편이다.'],
[13,'A','환경문제로 걱정되면, 내가 할 수 있는 일을 작은 단계로 나누어 계획하는 편이다.'],
[14,'E','환경문제로 느낀 걱정 속에서도, 내가 새롭게 배우거나 성장할 수 있는 점을 찾는 편이다.'],
[15,'A','환경문제로 걱정되면, 해결에 도움이 될 정보를 찾아보고 내 생활에 적용해 본다.'],
[16,'S','학교에서 분리배출이 제대로 되지 않아 재활용품과 일반 쓰레기가 섞여 있는 모습을 보고 걱정되었어요. 이때 내가 가장 먼저 할 것 같은 반응은 무엇인가요?',['친구에게 상황을 이야기하고, 함께 대응할 방법을 의논한다.','이 모습이 마음에 걸리는 이유를 생각하며, 내가 중요하게 여기는 가치를 돌아본다.','마음이 불편해져 일단 그 자리를 지나치고, 다른 일에 집중한다.','올바른 분리배출 방법을 확인하고, 안내를 개선할 방법을 찾아본다.','분리배출이 잘되는 학교의 모습을 상상하며, 상황이 나아지기를 바란다.'],'CEBAD'],
[17,'B','환경 뉴스가 계속 쏟아지면, 일부러 보는 양을 줄여 마음의 부담을 조절하는 편이다.'],
[18,'C','환경문제를 접하면, 친구나 가족과 어떻게 대응할지 함께 이야기해 보고 싶다.'],
[19,'D','환경문제로 걱정될 때, 언젠가 기술이나 정책이 상황을 나아지게 해 주리라 기대하며 마음을 놓는다.'],
[20,'E','환경문제로 속상할 때, 내가 왜 속상한지를 생각하며 내가 소중히 여기는 것을 확인하게 된다.'],
[21,'S','SNS에서 해양 쓰레기에 갇힌 바다 생물 영상을 보고 마음이 무거워졌어요. 이때 내가 가장 먼저 할 것 같은 반응은 무엇인가요?',['더 보면 힘들 것 같아 영상을 넘기고, 다른 콘텐츠를 본다.','깨끗해진 바다를 상상하며, 이런 일이 줄어들기를 바란다.','내 일회용품 사용을 살펴보고, 줄일 수 있는 것을 하나 정한다.','이 장면이 마음에 남는 이유를 생각하며, 내가 소중히 여기는 가치를 돌아본다.','가까운 사람에게 영상 때문에 느낀 마음을 이야기하고, 생각을 나눈다.'],'BDAEC'],
[22,'A','환경 실천이 잘 안 되면, 이유를 살펴보고 방법이나 환경을 바꿔 다시 시도하는 편이다.'],
[23,'B','환경문제로 마음이 무거울 때, 다른 활동에 몰두하며 그 생각이 줄어들기를 기다리는 편이다.'],
[24,'C','환경 실천을 혼자 하기 어려우면, 주변 사람과 역할을 나누거나 함께하자고 제안하는 편이다.'],
[25,'D','환경이 좋아진 미래를 떠올리면 걱정이 한결 가벼워지는 느낌이 든다.'],

if(b.id=='bk'){let i=ORDER.indexOf(S.step);let p=ORDER[i-1];if(S.step=='need')p=S.exp==1?'q3':'info';go(p)}
else if(b.id=='nx'){if(S.step=='intro'){go(S.consent==2?'guide':'info')}
else if(S.step=='info'){go(S.exp==1?'q0':'need')}
else if(S.step=='q3'){go('need')}
else if(S.step=='need'){go('result')}
else if(S.step=='result'){go('thanks')}
else{go(ORDER[ORDER.indexOf(S.step)+1])}}
if(S.step!='thanks')setTimeout(upd,0)});
go('intro');
</script></body></html>
